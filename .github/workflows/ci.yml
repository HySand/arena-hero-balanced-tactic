name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run privacy and secret scan
        shell: powershell
        run: .\scripts\security_check.ps1

      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -B -m compileall -q .

      - name: Check dependency consistency
        run: python -B -m pip check

      - name: Check dashboard JavaScript syntax
        run: node --check dashboard/app.js

  worker:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install TypeScript Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Verify TypeScript Worker
        working-directory: worker
        run: npm run check
