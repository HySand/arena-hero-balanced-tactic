[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-hero-balanced-tactic"
version = "0.1.0"
description = "Shared pure Python strategy for Arena Hero"
requires-python = ">=3.11"
dependencies = ["arena-hero>=0.2.9,<0.3"]

[tool.setuptools.packages.find]
include = ["arena_hero_tactic*"]
